name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned packages
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Unit tests (no models, microphone or network needed)
        run: python -m unittest discover -s tests
      - name: Instant phrase routing
        run: python scripts/check_phrases.py
