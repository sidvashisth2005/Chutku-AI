<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chutku presence</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/presence.css"><script src="/presence.js" defer></script></head>
<body data-phase="idle">
<header class="strip" id="strip" aria-live="polite" hidden>
  <button id="strip-talk" class="strip-eyes" title="Talk to Chutku (Ctrl+Alt+Space)" aria-label="Talk to Chutku"><canvas id="eyes" width="144" height="80" aria-hidden="true"></canvas></button>
  <p class="strip-text pywebview-drag-region" id="strip-text" title="Drag to move">Ready</p>
  <button id="expand" class="icon" title="Open the full Chutku window" aria-label="Open the full Chutku window"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
</header>
<main class="presence" aria-live="polite">
  <button id="to-bar" class="icon to-bar" title="Back to the small bar" aria-label="Back to the small bar" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg></button>
  <div class="orb-wrap"><canvas id="orb" width="320" height="320" aria-hidden="true"></canvas><button id="talk" class="talk" title="Talk to Chutku (Ctrl+Alt+Space)" aria-label="Talk to Chutku"></button></div>
  <section class="video" id="video" hidden><div class="video-frame" id="video-frame"></div><div class="video-bar"><span id="video-title"></span><button id="video-close" class="icon" title="Close the video" aria-label="Close the video">✕</button></div></section>
  <div class="phase" id="phase">Ready</div>
  <p class="heard" id="heard"></p>
  <p class="reply" id="reply"></p>
  <ol class="steps" id="steps"></ol>
  <section class="approval" id="approval" hidden>
    <strong>Confirm this step</strong>
    <p id="approval-text"></p>
    <div class="approval-actions"><button id="approve" class="primary">Approve</button><button id="reject">Cancel</button></div>
  </section>
  <p class="foot" id="foot">Ctrl+Alt+Space to talk · press again while I speak to cut me off</p>
</main>
</body></html>
